const STYLES = [["image_file_blotch", "V1 · ✨ Blotchy Ink-Wash (B1 · Default)"], ["image_file_loop_scr", "V2 · ➰ Circular Loop Scribble"], ["image_file_xhatch_scr", "V3 · ✖️ Cross-Hatch Scribble"], ["image_file_sub_scr", "V4 · 🪄 Subtractive Pass-3 Scribble"], ["image_file_c2", "V5 · 🪵 Riso Earth (C2 · Blotchy)"], ["image_file_c3", "V6 · 🌊 Ukiyo-e Woodblock (C3 · Blotchy)"], ["image_file_line", "V7 · ✒️ Pure Contour Line (G2+S2)"], ["image_file_g4", "V8 · 📐 Angular Straight-Edge (G4)"], ["image_file_c1", "V9 · 🌲 Riso Terra-Pine (C1 · Blotchy)"], ["image_file_c4", "V10 · 🌌 Ukiyo-e Prussian Blue (C4 · Blotchy)"], ["image_file_base", "V11 · 📜 Base Master Plate"], ["image_file_nb_loop_c3", "V12 · 🌊 Non-Blotch Loop + Ukiyo-e (C3)"], ["image_file_nb_loop_c4", "V13 · 🌌 Non-Blotch Loop + Prussian (C4)"], ["image_file_nb_line_c3", "V14 · 🌊 Non-Blotch Contour + Ukiyo-e (C3)"], ["image_file_nb_line_c4", "V15 · 🌌 Non-Blotch Contour + Prussian (C4)"], ["image_file_nb_base_c3", "V16 · 🌊 Non-Blotch Base + Ukiyo-e (C3)"], ["image_file_nb_base_c4", "V17 · 🌌 Non-Blotch Base + Prussian (C4)"], ["image_file_nb_sub_c3", "V18 · 🌊 Non-Blotch Subtractive + Ukiyo-e (C3)"], ["image_file_nb_xhatch_g2", "V19 · ✒️ Non-Blotch X-Hatch Contour (G2)"]];

let currentSpecies = 'ALL';
let currentStyleField = 'image_file_blotch';

function init() {
  const styleSel = document.getElementById('styleSelect');
  STYLES.forEach(([field, label]) => {
    const opt = document.createElement('option');
    opt.value = field;
    opt.textContent = label;
    styleSel.appendChild(opt);
  });
  styleSel.addEventListener('change', (e) => {
    currentStyleField = e.target.value;
    render();
  });

  const speciesSet = ['ALL', ...new Set(PLATES.map(p => p.species))];
  const filterWrap = document.getElementById('speciesFilters');
  speciesSet.forEach(sp => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (sp === 'ALL' ? ' active' : '');
    const count = sp === 'ALL' ? PLATES.length : PLATES.filter(p => p.species === sp).length;
    btn.textContent = `${sp === 'ALL' ? 'All Species' : sp} (${count})`;
    btn.onclick = () => {
      currentSpecies = sp;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    filterWrap.appendChild(btn);
  });

  render();
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  lb.style.display = 'flex';
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = currentSpecies === 'ALL' ? PLATES : PLATES.filter(p => p.species === currentSpecies);
  grid.innerHTML = filtered.map(p => {
    const imgSrc = p.fields[currentStyleField] || p.fields.image_file_blotch;
    const wiredHtml = (p.wired_lessons || []).map(w =>
      `<a class="wired-pill" href="bible_study_viewer.html?book=${encodeURIComponent(w.book)}" title="${w.title}">${w.book} #${w.number} (${w.citation})</a>`
    ).join('');
    return `
      <div class="card">
        <div class="img-wrap" onclick="openLightbox('${imgSrc}')">
          <span class="badge-num">PLATE #${String(p.idx).padStart(2, '0')}</span>
          <span class="badge-species">${p.species}</span>
          <img src="${imgSrc}" alt="${p.pose_title}" loading="lazy" />
        </div>
        <div class="card-body">
          <h3 class="pose-title">${p.pose_title}</h3>
          <div class="stem-code">${p.stem} · <code>${imgSrc.split('/').pop()}</code></div>
          <div class="wired-list">
            <strong>Wired in Lessons:</strong><br/>
            ${wiredHtml || '<em>Available in pool</em>'}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

init();
</script>
