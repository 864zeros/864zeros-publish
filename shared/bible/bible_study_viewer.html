 any time we should let them slip [drift away].","lesson":"Spiritual backsliding is rarely a deliberate leap; it is almost always a slow, gradual drift caused by neglect.","application":"Anchor your daily schedule in prayer and Scripture to prevent slow spiritual drift."},{"number":2,"title":"Encourage one another daily to prevent hardened hearts","citation":"Hebrews 3:13","scripture_text":"But exhort one another daily, while it is called To day; lest any of you be hardened through the deceitfulness of sin.","lesson":"Sin's deceitfulness hardens the heart; daily mutual encouragement and accountability are essential safeguards.","application":"Send an encouraging, faith-building text or call to a brother or sister today."},{"number":3,"title":"Let the living Word of God search your deepest motives","citation":"Hebrews 4:12","scripture_text":"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit... and is a discerner of the thoughts and intents of the heart.","lesson":"Scripture is not dead text; it is an active, surgical mirror that discerns and purifies your true internal motives.","application":"Allow Scripture to examine and expose any hidden selfish motives in your current plans."},{"number":4,"title":"Come boldly to the throne of grace to find mercy and help in time of need","citation":"Hebrews 4:15-16","scripture_text":"For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin. Let us therefore come boldly unto the throne of grace...","lesson":"Because Jesus understands your exact human struggles and temptations, approach God in prayer with bold confidence.","application":"Bring your deepest struggle to Jesus right now, knowing He sympathizes completely with you."},{"number":5,"title":"Anchor your soul in the unshakeable hope behind the veil","citation":"Hebrews 6:18-19","scripture_text":"...who have fled for refuge to lay hold upon the hope set before us: Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;","lesson":"Your emotional stability does not rest on shifting worldly circumstances, but on the unshakeable anchor of Christ.","application":"Anchor your peace in Christ's finished work when life's external storms toss you around."},{"number":6,"title":"Do not forsake gathering together; stir up love and good works","citation":"Hebrews 10:24-25","scripture_text":"And let us consider one another to provoke unto love and to good works: Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.","lesson":"Christian faith is not a solitary sport; commit to regular, active corporate worship and fellowship to spur on love.","application":"Prioritize gathering with your church family and encourage someone while you are there."},{"number":7,"title":"Live by faith: the substance of things hoped for, the evidence of things unseen","citation":"Hebrews 11:1,6","scripture_text":"Now faith is the substance of things hoped for, the evidence of things not seen... But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.","lesson":"Faith is not wishful thinking; it is stepping out in confident trust on God's character and promises.","application":"Take a courageous step of obedience today that requires total trust in God."},{"number":8,"title":"Lay aside every weight and run your race looking unto Jesus","citation":"Hebrews 12:1-2","scripture_text":"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us, Looking unto Jesus the author and finisher of our faith...","lesson":"Strip off distracting encumbrances and recurring sins; fix your gaze on Jesus and run your assigned race with perseverance.","application":"Identify and eliminate a non-sinful 'weight' (distraction, habit) that is slowing your spiritual race."},{"number":9,"title":"Welcome God's loving discipline as proof of your sonship","citation":"Hebrews 12:6,11","scripture_text":"For whom the Lord loveth he chasteneth... Now no chastening for the present seemeth to be joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby.","lesson":"God's discipline is not punishment from an angry judge, but loving correction from a Father training you for holiness.","application":"Receive corrective feedback or difficult trials as tools yielding the peaceable fruit of righteousness."},{"number":10,"title":"Know that Jesus Christ is the same yesterday, today, and forever","citation":"Hebrews 13:5,8","scripture_text":"Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee... Jesus Christ the same yesterday, and to day, and for ever.","lesson":"In a world of constant change, Christ's character, promises, and faithful presence remain completely immutable.","application":"Find total contentment today in the permanent promise: 'I will never leave you nor forsake you.'"}]},{"book":"James","order":59,"testament":"NT","category":"General Epistles","overview":"Written by James the brother of Jesus and leader of the Jerusalem church, this intensely practical 'Proverbs of the New Testament' demands that faith be demonstrated through action: 'Be ye doers of the word, and not hearers only' (James 1:22). James addresses joy in trials, taming the tongue, true religion caring for orphans and widows, the danger of partiality, and wholehearted prayer.","key_themes":["Faith Without Works is Dead","Taming the Tongue","Counting Trials as Joy (Patience)","Pure Religion & Humility Before God"],"lessons":[{"number":1,"title":"Count trials as pure joy because they produce enduring patience","citation":"James 1:2-4","scripture_text":"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience. But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.","lesson":"Do not waste your trials; embrace the friction of adversity as God's gym to build mature, complete endurance.","application":"Choose a joyful, learning attitude toward your biggest frustration today."},{"number":2,"title":"Ask God for wisdom in faith without wavering or doubt","citation":"James 1:5-6","scripture_text":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him. But let him ask in faith, nothing wavering.","lesson":"God gives wisdom generously and without reproach to those who ask with steady, undivided faith.","application":"Ask God specifically for divine wisdom before stepping into a complex meeting or decision."},{"number":3,"title":"Be quick to listen, slow to speak, and slow to become angry","citation":"James 1:19-20","scripture_text":"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: For the wrath of man worketh not the righteousness of God.","lesson":"Human rage and impulsive speech never produce God's righteousness; master the art of attentive listening and restraint.","application":"In your next conversation, listen intently for two minutes before offering your opinion."},{"number":4,"title":"Be doers of the Word, not deceptive self-deceiving hearers only","citation":"James 1:22-25","scripture_text":"But be ye doers of the word, and not hearers only, deceiving your own selves... Whoso looketh into the perfect law of liberty, and continueth therein, he being not a forgetful hearer, but a doer of the work, this man shall be blessed in his deed.","lesson":"Listening to sermons or reading the Bible without putting it into direct daily practice is spiritual delusion.","application":"Take one clear command from Scripture and execute it immediately today."},{"number":5,"title":"Practice pure religion: care for orphans, widows, and keep unspotted","citation":"James 1:27","scripture_text":"Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.","lesson":"True spirituality is verified by practical compassion for vulnerable, powerless people and personal moral purity.","application":"Visit, support, or send practical aid to an orphan, widow, or vulnerable person this week."},{"number":6,"title":"Eliminate all favoritism and snobbery based on wealth or status","citation":"James 2:1-4","scripture_text":"My brethren, have not the faith of our Lord Jesus Christ, the Lord of glory, with respect of persons... Are ye not then partial in yourselves, and are become judges of evil thoughts?","lesson":"Treating wealthy people with honor while ignoring the poor violates the royal law of love; show equal honor to all.","application":"Go out of your way to show warmth and respect to someone in a lower socioeconomic position."},{"number":7,"title":"Demonstrate your faith through tangible, active works","citation":"James 2:17,26","scripture_text":"Even so faith, if it hath not works, is dead, being alone... For as the body without the spirit is dead, so faith without works is dead also.","lesson":"Genuine saving faith is never invisible; it inevitably produces active deeds of mercy, generosity, and justice.","application":"Back up your stated faith with a tangible act of service or financial generosity today."},{"number":8,"title":"Tame the tongue: a small spark that can ignite a forest fire","citation":"James 3:5-6,9-10","scripture_text":"Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!... Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.","lesson":"Unchecked speech can destroy reputations, marriages, and organizations; guard your words with strict discipline.","application":"Refrain from sarcasm, gossip, or biting critique in all your communication today."},{"number":9,"title":"Humble yourself before God and submit your future plans to His will","citation":"James 4:7,10,13-15","scripture_text":"Submit yourselves therefore to God. Resist the devil, and he will flee from you... Humble yourselves in the sight of the Lord, and he shall lift you up... For that ye ought to say, If the Lord will, we shall live, and do this, or that.","lesson":"Reject arrogant boasting about tomorrow; submit your schedule and life to 'If the Lord wills.'","application":"Frame your future plans and business goals with humble submission to God's sovereign will."},{"number":10,"title":"Confess your faults to one another and pray for healing","citation":"James 5:16","scripture_text":"Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.","lesson":"Vulnerability and confession within trusted Christian community unlock emotional, physical, and spiritual healing.","application":"Confess a struggle to a trusted prayer partner and pray together for victory."}]},{"book":"1 Peter","order":60,"testament":"NT","category":"General Epistles","overview":"Writing from Rome ('Babylon') to persecuted Gentile and Jewish believers scattered across Asia Minor, the Apostle Peter encourages Christians to stand fast as 'strangers and pilgrims.' Peter unpacks our living hope through Christ's resurrection, holy living, submitting to authorities, following Christ's example in suffering, and casting all anxiety upon God.","key_themes":["A Living Hope & Incorruptible Inheritance","Living as Holy Strangers and Pilgrims","Following Christ's Example in Suffering","Casting All Anxiety Upon God"],"lessons":[{"number":1,"title":"Rejoice in your living hope and incorruptible inheritance","citation":"1 Peter 1:3-4","scripture_text":"Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead, To an inheritance incorruptible, and undefiled, and that fadeth not away, reserved in heaven for you,","lesson":"Your ultimate wealth is reserved in heaven, completely immune to earthly rust, decay, inflation, or loss.","application":"Find deep security in your eternal heavenly inheritance rather than volatile earthly assets."},{"number":2,"title":"Gird up the loins of your mind and be holy in all conduct","citation":"1 Peter 1:13,15-16","scripture_text":"Wherefore gird up the loins of your mind, be sober, and hope to the end... But as he which hath called you is holy, so be ye holy in all manner of conversation; Because it is written, Be ye holy; for I am holy.","lesson":"Discipline your mental life and pursue wholehearted holiness in every relationship, conversation, and action.","application":"Bring disciplined focus to your thoughts today and choose holiness in your speech."},{"number":3,"title":"Love one another deeply from a pure heart","citation":"1 Peter 1:22","scripture_text":"Seeing ye have purified your souls in obeying the truth through the Spirit unto unfeigned love of the brethren, see that ye love one another with a pure heart fervently:","lesson":"Genuine obedience to truth produces deep, authentic, fervent love for fellow believers.","application":"Demonstrate fervent, unselfish love to a fellow believer today."},{"number":4,"title":"Live as a royal priesthood and declare God's praises","citation":"1 Peter 2:9","scripture_text":"But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:","lesson":"You are God's chosen representative, called out of darkness to radiate His marvelous light to the world.","application":"Walk today with the quiet dignity and purpose of someone who belongs to a royal priesthood."},{"number":5,"title":"Live honorably so your good deeds silence hostile critics","citation":"1 Peter 2:12,15","scripture_text":"Having your conversation honest among the Gentiles: that, whereas they speak against you as evildoers, they may by your good works, which they shall behold, glorify God... For so is the will of God, that with well doing ye may put to silence the ignorance of foolish men:","lesson":"The best answer to slander and false accusations is an airtight track record of consistent integrity and good works.","application":"Silence critics by responding with exemplary kindness, honesty, and excellence in your work."},{"number":6,"title":"Follow Christ's example: do not retaliate when reviled","citation":"1 Peter 2:21-23","scripture_text":"For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps... Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously:","lesson":"When mistreated, refuse to return insults or threats; entrust yourself to God who judges righteously.","application":"Do not fire back an insult when someone criticizes you; respond with calm grace."},{"number":7,"title":"Cultivate the imperishable beauty of a gentle and quiet spirit","citation":"1 Peter 3:3-4","scripture_text":"Whose adorning let it not be that outward adorning... But let it be the hidden man of the heart... even the ornament of a meek and quiet spirit, which is in the sight of God of great price.","lesson":"True, lasting beauty is internal: a gentle, tranquil, and steady spirit that God treasures immensely.","application":"Focus on cultivating internal peace, gentleness, and humility rather than obsessing over outward appearance."},{"number":8,"title":"Always be ready to give a reasoned defense for your hope with gentleness","citation":"1 Peter 3:15","scripture_text":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:","lesson":"Equip yourself to explain the rational and spiritual reasons for your faith, communicating with gentleness and respect.","application":"Practice articulating clearly and gently why you have hope in Jesus Christ."},{"number":9,"title":"Cast all your anxiety upon God, for He cares for you","citation":"1 Peter 5:7","scripture_text":"Casting all your care upon him; for he careth for you.","lesson":"Do not hoard anxiety; throw the full weight of your worries onto God, knowing He intimately cares for you.","application":"Throw your heaviest worry onto God in prayer and refuse to pick it back up."},{"number":10,"title":"Stay vigilant and resist the enemy, firm in the faith","citation":"1 Peter 5:8-10","scripture_text":"Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour: Whom resist stedfast in the faith... But the God of all grace... make you perfect, stablish, strengthen, settle you.","lesson":"Stay spiritually alert against temptation; stand firm in faith, knowing God will strengthen and settle you.","application":"Guard your spiritual boundaries today and resist a subtle lure toward compromise."}]},{"book":"2 Peter","order":61,"testament":"NT","category":"General Epistles","overview":"Written as Peter's farewell testament shortly before his martyrdom, 2 Peter focuses on growing in spiritual maturity through the divine nature (2 Pet 1), exposing and condemning corrupt false teachers who scoff at holiness (2 Pet 2), and defending the reality of Christ's Second Coming and the fiery renewal of creation, calling believers to live holy lives (2 Pet 3).","key_themes":["Partakers of the Divine Nature","Adding to Your Faith (The Growth Ladder)","Exposing Corrupt False Teachers","The Day of the Lord & New Heavens/Earth"],"lessons":[{"number":1,"title":"Know that God has given you everything needed for life and godliness","citation":"2 Peter 1:3-4","scripture_text":"According as his divine power hath given unto us all things that pertain unto life and godliness, through the knowledge of him... whereby are given unto us exceeding great and precious promises: that by these ye might be partakers of the divine nature...","lesson":"You lack no spiritual resource; God's divine power and promises supply everything necessary to live a victorious, godly life.","application":"Rely on God's divine power rather than claiming you are powerless against bad habits."},{"number":2,"title":"Dilogently add virtue, knowledge, temperance, patience, and love to your faith","citation":"2 Peter 1:5-8","scripture_text":"And beside this, giving all diligence, add to your faith virtue; and to virtue knowledge; And to knowledge temperance; and to temperance patience; and to patience godliness; And to godliness brotherly kindness; and to brotherly kindness charity.","lesson":"Spiritual growth requires intentional daily diligence to build character, knowledge, self-control, patience, and love.","application":"Focus on adding patience and self-control to your reactions today."},{"number":3,"title":"Make your calling and election sure so you never fall","citation":"2 Peter 1:10-11","scripture_text":"Wherefore the rather, brethren, give diligence to make your calling and election sure: for if ye do these things, ye shall never fall: For so an entrance shall be ministered unto you abundantly into the everlasting kingdom...","lesson":"Active pursuit of Christian virtues confirms your salvation and ensures an abundant, unshakeable entrance into eternity.","application":"Cultivate consistent spiritual habits to keep your faith strong and fruitful."},{"number":4,"title":"Trust Scripture as the sure word of prophecy inspired by the Holy Spirit","citation":"2 Peter 1:19,21","scripture_text":"We have also a more sure word of prophecy; whereunto ye do well that ye take heed, as unto a light that shineth in a dark place... For the prophecy came not in old time by the will of man: but holy men of God spake as they were moved by the Holy Ghost.","lesson":"Scripture is not human invention; it is the divinely inspired light of God that guides us through dark cultural times.","application":"Heed the teachings of Scripture as a radiant light guiding your daily choices."},{"number":5,"title":"Beware of deceptive teachers who exploit with fabricated words","citation":"2 Peter 2:1-3","scripture_text":"There shall be false teachers among you, who privily shall bring in damnable heresies... And through covetousness shall they with feigned words make merchandise of you...","lesson":"Be discerning; false teachers twist truth to exploit people for money, fame, and sensual indulgence.","application":"Evaluate teachers and authors by their moral fruit and alignment with Scripture, not charisma."},{"number":6,"title":"Know that the Lord knows how to deliver the godly out of temptations","citation":"2 Peter 2:9","scripture_text":"The Lord knoweth how to deliver the godly out of temptations, and to reserve the unjust unto the day of judgment to be punished:","lesson":"No matter how corrupt your surrounding environment, God is an expert at delivering and preserving those who love Him.","application":"Trust God to provide a way of deliverance when you feel surrounded by moral compromise."},{"number":7,"title":"Do not return like a dog to its vomit (True Freedom vs. Relapse)","citation":"2 Peter 2:19,22","scripture_text":"While they promise them liberty, they themselves are the servants of corruption: for of whom a man is overcome, of the same is he brought in bondage... The dog is turned to his own vomit again; and the sow that was washed to her wallowing in the mire.","lesson":"Returning to old, destructive sins after tasting freedom is tragic folly; guard your sobriety and purity with vigilance.","application":"Refuse to entertain or return to an old habit or addiction that you previously walked away from."},{"number":8,"title":"Understand God's patience: He is not willing that any should perish","citation":"2 Peter 3:9","scripture_text":"The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.","lesson":"God's delay in judgment is not slowness; it is merciful patience giving people time to repent and be saved.","application":"Use the current season of God's patience to share the gospel with an unsaved friend."},{"number":9,"title":"Live holy and godly lives in light of the coming new heavens and earth","citation":"2 Peter 3:11,13-14","scripture_text":"Seeing then that all these things shall be dissolved, what manner of persons ought ye to be in all holy conversation and godliness... we, according to his promise, look for new heavens and a new earth, wherein dwelleth righteousness.","lesson":"Since this temporal world will be purified by fire, invest your life in eternal holiness and righteousness.","application":"Evaluate what you are building today: will it survive into the eternal new creation?"},{"number":10,"title":"Grow in the grace and knowledge of our Lord and Savior Jesus Christ","citation":"2 Peter 3:18","scripture_text":"But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ. To him be glory both now and for ever. Amen.","lesson":"Never become spiritually stagnant; continue growing daily in the grace, love, and intimate knowledge of Jesus.","application":"Set a personal goal to deepen your knowledge of Christ through focused study and prayer."}]},{"book":"1 John","order":62,"testament":"NT","category":"General Epistles","overview":"Written by the elderly Apostle John to provide assurance of eternal life ('that ye may know that ye have eternal life,' 1 John 5:13), 1 John outlines the three essential tests of authentic Christian faith: the moral test (obeying God's commands), the social test (loving the brothers), and the doctrinal test (confessing that Jesus is the Son of God come in the flesh).","key_themes":["Walking in the Light vs. Darkness","Confession & Christ Our Advocate","God is Love (Agape)","Assurance of Eternal Life"],"lessons":[{"number":1,"title":"Walk in the light and experience real fellowship and cleansing","citation":"1 John 1:7","scripture_text":"But if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus Christ his Son cleanseth us from all sin.","lesson":"Live in honesty, transparency, and truth with God and others; Christ's blood continually washes away sin.","application":"Live transparently today without hiding or pretending in your relationships."},{"number":2,"title":"Confess your sins: God is faithful and just to forgive and cleanse","citation":"1 John 1:9","scripture_text":"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","lesson":"Do not deny or excuse your moral failures; bring them into the open through confession to receive complete cleansing.","application":"Confess a recent mistake or impure thought to God immediately and receive His clean pardon."},{"number":3,"title":"Know that Jesus Christ the Righteous is your heavenly Advocate","citation":"1 John 2:1-2","scripture_text":"My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous: And he is the propitiation for our sins...","lesson":"When you stumble, you do not face God alone; Jesus stands as your defense Attorney who paid your full debt.","application":"Rest in Christ's advocacy for you whenever feelings of condemnation arise."},{"number":4,"title":"Do not love the world or the things of the world","citation":"1 John 2:15-17","scripture_text":"Love not the world, neither the things that are in the world... For all that is in the world, the lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father... And the world passeth away...","lesson":"Worldly pleasures, greed, and status are fleeting illusions; only those who do God's will abide forever.","application":"Renounce a desire for worldly status or materialism and invest in doing God's will."},{"number":5,"title":"Behold what manner of love the Father has bestowed upon us","citation":"1 John 3:1-2","scripture_text":"Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God... Beloved, now are we the sons of God, and it doth not yet appear what we shall be: but we know that, when he shall appear, we shall be like him...","lesson":"You are an actual, beloved child of God; let the hope of seeing Christ purify your daily conduct.","application":"Live today with the joy and dignity of being an adopted child of the living God."},{"number":6,"title":"Love not in word or tongue only, but in deed and in truth","citation":"1 John 3:17-18","scripture_text":"But whoso hath this world's good, and seeth his brother have need, and shutteth up his bowels of compassion from him, how dwelleth the love of God in him? My little children, let us not love in word, neither in tongue; but in deed and in truth.","lesson":"Genuine love is measured by tangible action, open wallets, and practical help, not empty verbal promises.","application":"Meet a practical, material need for a struggling brother or sister today."},{"number":7,"title":"Test the spirits to see whether they are from God","citation":"1 John 4:1-3","scripture_text":"Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world. Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God:","lesson":"Do not accept spiritual teachings uncritically; verify whether they align with the biblical truth of Jesus Christ.","application":"Test teachings and cultural messages against the truth of Christ's incarnation and Word."},{"number":8,"title":"Remember that He who is in you is greater than he who is in the world","citation":"1 John 4:4","scripture_text":"Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world.","lesson":"The Holy Spirit dwelling inside you has vastly greater power than Satan, cultural hostility, and worldly opposition.","application":"Face intimidating challenges with confidence knowing the Greater One lives inside you."},{"number":9,"title":"Cast out fear with the perfect love of God","citation":"1 John 4:18-19","scripture_text":"There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love. We love him, because he first loved us.","lesson":"Resting in God's perfect, unconditional love eliminates the tormenting fear of rejection and judgment.","application":"Dispel an anxious fear today by meditating on God's perfect, unwavering love for you."},{"number":10,"title":"Know with certainty that you have eternal life in the Son","citation":"1 John 5:11-13","scripture_text":"And this is the record, that God hath given to us eternal life, and this life is in his Son. He that hath the Son hath life; and he that hath not the Son of God hath not life. These things have I written unto you... that ye may know that ye have eternal life...","lesson":"Your salvation is not a nervous guess; having Jesus guarantees that you possess eternal life right now.","application":"Live with joyful certainty and assurance that you possess eternal life in Christ."}]},{"book":"2 John","order":63,"testament":"NT","category":"General Epistles","overview":"In this concise personal letter addressed to 'the elect lady and her children,' the Apostle John emphasizes the twin virtues of Christian discipleship: walking in truth and walking in love. John sternly warns against extending hospitality or endorsement to deceptive teachers who deny the incarnation of Christ.","key_themes":["Truth and Love in Perfect Balance","Walking in God's Commandments","Guarding Against Deceivers & Antichrists","Maintaining the Doctrine of Christ"],"lessons":[{"number":1,"title":"Keep truth and love bound together in perfect balance","citation":"2 John 1:3","scripture_text":"Grace be with you, mercy, and peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.","lesson":"Truth without love turns harsh and legalistic; love without truth turns spineless and sentimental; keep both united.","application":"Speak hard truth with deep tenderness and compassion in your conversations today."},{"number":2,"title":"Rejoice when you see your children walking in the truth","citation":"2 John 1:4","scripture_text":"I rejoiced greatly that I found of thy children walking in truth, as we have received a commandment from the Father.","lesson":"There is no greater parental or mentoring joy than seeing the next generation live out authentic biblical integrity.","application":"Encourage a young person or mentee who is walking faithfully in integrity."},{"number":3,"title":"Walk in love by keeping God's commandments","citation":"2 John 1:5-6","scripture_text":"And now I beseech thee, lady... that we love one another. And this is love, that we walk after his commandments.","lesson":"Christian love is not vague emotion; it is defined by concrete, daily obedience to God's moral commands.","application":"Express your love to God today through specific obedience to His Word."},{"number":4,"title":"Watch yourself so you do not lose what you have worked for","citation":"2 John 1:8","scripture_text":"Look to yourselves, that we lose not those things which we have wrought, but that we receive a full reward.","lesson":"Be vigilant; careless compromise or entertaining false ideas can forfeit spiritual fruit and eternal rewards.","application":"Guard your spiritual habits and character against careless complacency."},{"number":5,"title":"Abide faithfully in the doctrine of Jesus Christ","citation":"2 John 1:9","scripture_text":"Whosoever transgresseth, and abideth not in the doctrine of Christ, hath not God. He that abideth in the doctrine of Christ, he hath both the Father and the Son.","lesson":"Do not 'progress' beyond the historic, sound doctrine of Christ into trendy theological innovations.","application":"Stay firmly anchored in sound, historic biblical doctrine regarding Jesus."},{"number":6,"title":"Do not endorse, finance, or platform false teachers","citation":"2 John 1:10-11","scripture_text":"If there come any unto you, and bring not this doctrine, receive him not into your house, neither bid him God speed: For he that biddeth him God speed is partaker of his evil deeds.","lesson":"Providing hospitality, funding, or platforms to dangerous false teachers makes you complicit in their deception.","application":"Exercise strict discernment in what ministries, books, and teachers you financially support."},{"number":7,"title":"Recognize that truth abides with us forever","citation":"2 John 1:2","scripture_text":"For the truth's sake, which dwelleth in us, and shall be with us for ever.","lesson":"Cultural fads and human opinions dissolve, but God's truth lives in us and endures for all eternity.","application":"Anchor your confidence in the eternal permanence of God's Word."},{"number":8,"title":"Value face-to-face fellowship over distant communication","citation":"2 John 1:12","scripture_text":"Having many things to write unto you, I would not write with paper and ink: but I trust to come unto you, and speak face to face, that our joy may be full.","lesson":"Digital and written communication cannot replace the full, rich joy of in-person, face-to-face communion.","application":"Make time for an in-person, face-to-face conversation with a friend or family member."},{"number":9,"title":"Guard against deceivers who deny Christ's physical reality","citation":"2 John 1:7","scripture_text":"For many deceivers are entered into the world, who confess not that Jesus Christ is come in the flesh. This is a deceiver and an antichrist.","lesson":"Uphold the true incarnation of Jesus Christ—fully God and fully man—against spiritualizing heresies.","application":"Affirm the reality that Jesus lived, died, and rose in real bodily history for your redemption."},{"number":10,"title":"Live in the fullness of complete Christian joy","citation":"2 John 1:12","scripture_text":"...that our joy may be full.","lesson":"Walking in truth, loving one another, and enjoying authentic fellowship produces complete, overflowing joy.","application":"Cultivate deep, shared joy in your home and church fellowship today."}]},{"book":"3 John","order":64,"testament":"NT","category":"General Epistles","overview":"Addressed to Paul's beloved friend Gaius, 3 John contrasts three distinct leaders in the early church: Gaius (who exemplified faithful hospitality and love to traveling teachers), Diotrephes (an arrogant, power-hungry dictator who loved preeminence and slandered the apostles), and Demetrius (a brother commended by all for his exemplary walk in truth).","key_themes":["Hospitality & Supporting Gospel Workers","The Danger of Power-Hungry Leaders (Diotrephes)","Walking in Truth as Fellow Workers for Truth","Imitating Good, Not Evil"],"lessons":[{"number":1,"title":"Pray for holistic health—physical, emotional, and spiritual","citation":"3 John 1:2","scripture_text":"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.","lesson":"God cares about your physical vitality, material well-being, and internal spiritual health; pursue all three.","application":"Take proactive care of your physical health, mental rest, and spiritual growth today."},{"number":2,"title":"Walk consistently in the truth as your greatest joy","citation":"3 John 1:3-4","scripture_text":"For I rejoiced greatly, when the brethren came and testified of the truth that is in thee, even as thou walkest in the truth. I have no greater joy than to hear that my children walk in truth.","lesson":"The greatest validation of your faith is not charismatic speech, but a consistent daily walk in integrity and truth.","application":"Live with such steady integrity that others testify to the truth seen in your life."},{"number":3,"title":"Practice faithful hospitality to missionaries and servants of God (Gaius)","citation":"3 John 1:5-6","scripture_text":"Beloved, thou doest faithfully whatsoever thou doest to the brethren, and to strangers; Which have borne witness of thy charity before the church...","lesson":"Open your home, table, and resources to support and refresh traveling servants of Christ.","application":"Offer hospitality or financial support to a missionary, pastor, or visiting servant of God."},{"number":4,"title":"Become a fellow worker for the truth through generous support","citation":"3 John 1:8","scripture_text":"We therefore ought to receive such, that we might be fellowhelpers to the truth.","lesson":"When you fund, house, and support gospel teachers, you become an active co-worker in their spiritual fruit.","application":"Give financially to support gospel preaching and Bible distribution."},{"number":5,"title":"Beware of leaders who love to have the preeminence (Diotrephes)","citation":"3 John 1:9","scripture_text":"I wrote unto the church: but Diotrephes, who loveth to have the preeminence among them, receiveth us not.","lesson":"Guard against narcissistic leaders who demand total control, crave the spotlight, and reject godly accountability.","application":"Check your own heart: do you seek preeminence and control, or humble servanthood?"},{"number":6,"title":"Confront abusive and malicious slander directly","citation":"3 John 1:10","scripture_text":"Wherefore, if I come, I will remember his deeds which he doeth, prating against us with malicious words...","lesson":"Do not sweep toxic, authoritarian bullying and malicious gossip under the rug; address it with courage.","application":"Refuse to participate in or tolerate malicious gossip aimed at tearing down church leaders or peers."},{"number":7,"title":"Follow not that which is evil, but that which is good","citation":"3 John 1:11","scripture_text":"Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath not seen God.","lesson":"Do not imitate the ruthless tactics of worldly, arrogant leaders; imitate Christlike goodness, humility, and love.","application":"Choose the high road of goodness and integrity when provoked by someone behaving badly."},{"number":8,"title":"Build a reputation verified by the truth itself (Demetrius)","citation":"3 John 1:12","scripture_text":"Demetrius hath good report of all men, and of the truth itself: yea, and we also bear record; and ye know that our record is true.","lesson":"Cultivate a character so undeniably upright that both the community and the Word of God endorse you.","application":"Focus on living in such alignment with truth that your reputation is beyond reproach."},{"number":9,"title":"Greet friends personally by name","citation":"3 John 1:14","scripture_text":"Peace be to thee. Our friends salute thee. Greet the friends by name.","lesson":"Personal relationships matter; value individuals by knowing and greeting them by name with genuine warmth.","application":"Greet people by their names today with sincere, personal warmth."},{"number":10,"title":"Pursue deep peace in your spiritual community","citation":"3 John 1:14","scripture_text":"Peace be to thee...","lesson":"Cultivate an atmosphere of divine peace, reconciliation, and mutual honor within your church family.","application":"Actively promote peace and harmony in your local community today."}]},{"book":"Jude","order":65,"testament":"NT","category":"General Epistles","overview":"Jude, the brother of James and Jesus, originally intended to write about our common salvation, but felt compelled to urge believers to 'earnestly contend for the faith once delivered unto the saints' (Jude 1:3). Jude exposes insidious false teachers who turn grace into a license for immorality, calling believers to build themselves up in faith, pray in the Spirit, and rescue the wavering, ending with a breathtaking doxology.","key_themes":["Contending Earnestly for the Faith","Exposing Apostasy & License for Immorality","Building Yourself Up in the Holy Spirit","The Doxology: Able to Keep You from Falling"],"lessons":[{"number":1,"title":"Contend earnestly for the faith once delivered to the saints","citation":"Jude 1:3","scripture_text":"Beloved... it was needful for me to write unto you, and exhort you that ye should earnestly contend for the faith which was once delivered unto the saints.","lesson":"Stand courageously to defend biblical doctrine against cultural dilution and false teachings.","application":"Study and defend foundational Christian truth with clarity, firmness, and love."},{"number":2,"title":"Beware of turning the grace of God into a license for immorality","citation":"Jude 1:4","scripture_text":"For there are certain men crept in unawares... ungodly men, turning the grace of our God into lasciviousness, and denying the only Lord God, and our Lord Jesus Christ.","lesson":"True grace delivers from sin; anyone who uses grace to excuse ongoing willful immorality is deceiving themselves.","application":"Refuse to use grace as an excuse for moral compromise or indulgence."},{"number":3,"title":"Remember the sobering lessons of past judgment (Egypt, Sodom, Angels)","citation":"Jude 1:5,7","scripture_text":"I will therefore put you in remembrance... how that the Lord, having saved the people out of the land of Egypt, afterward destroyed them that believed not... Even as Sodom and Gomorrha...","lesson":"God's past judgments remind us that unrepentant rebellion, sexual perversion, and unbelief have real consequences.","application":"Live with reverent moral seriousness and accountability before God."},{"number":4,"title":"Avoid the rebellious pathways of Cain, Balaam, and Korah","citation":"Jude 1:11","scripture_text":"Woe unto them! for they have gone in the way of Cain, and ran greedily after the error of Balaam for reward, and perished in the gainsaying of Core.","lesson":"Guard against jealousy and murder (Cain), financial greed and compromise (Balaam), and arrogant rebellion (Korah).","application":"Examine your motives for jealousy, financial compromise, or rebellion against godly leadership."},{"number":5,"title":"Recognize the hollow nature of clouds without water","citation":"Jude 1:12","scripture_text":"These are spots in your feasts of charity... clouds they are without water, carried about of winds; trees whose fruit withereth, without fruit, twice dead...","lesson":"False spirituality makes grand promises but delivers zero life-giving substance; look for genuine fruit.","application":"Cultivate real spiritual substance and fruit rather than flashy, empty words."},{"number":6,"title":"Build yourself up on your most holy faith","citation":"Jude 1:20","scripture_text":"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost,","lesson":"Take active responsibility for your spiritual growth by feeding on truth and praying in the Holy Spirit.","application":"Spend time in deep prayer in the Holy Spirit and biblical study to build your spiritual strength today."},{"number":7,"title":"Keep yourself in the love of God looking for eternal mercy","citation":"Jude 1:21","scripture_text":"Keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life.","lesson":"Remain positioned under the constant flow of God's love through ongoing obedience and expectant hope.","application":"Meditate on resting in God's love throughout your day."},{"number":8,"title":"Have compassion on those who doubt and waver","citation":"Jude 1:22","scripture_text":"And of some have compassion, making a difference:","lesson":"Treat struggling doubters with gentle, patient compassion rather than harsh judgment.","application":"Listen with patience and tender empathy to a friend who is wrestling with spiritual doubts."},{"number":9,"title":"Pull others out of the fire with urgent care and moral vigilance","citation":"Jude 1:23","scripture_text":"And others save with fear, pulling them out of the fire; hating even the garment spotted by the flesh.","lesson":"Intervene with urgent, courageous love to rescue someone heading into spiritual destruction while guarding yourself.","application":"Reach out with loving urgency to help someone sliding toward disaster."},{"number":10,"title":"Trust the only wise God who is able to keep you from falling","citation":"Jude 1:24-25","scripture_text":"Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy, To the only wise God our Saviour, be glory and majesty, dominion and power, both now and ever. Amen.","lesson":"Your ultimate security rests in God's power: He is fully able to keep you from stumbling and present you blameless with overflowing joy.","application":"Praise the only wise God for His power to preserve your soul blameless to the end."}]},{"book":"Revelation","order":66,"testament":"NT","category":"Apocalyptic","overview":"The grand finale of the Bible, Revelation ('the unveiling of Jesus Christ') was written by John in exile on Patmos. Through breathtaking apocalyptic imagery, John reveals Christ as the Risen Lord, the Slain Lamb upon the Throne, the Judge of the earth, the Overcomer of Babylon and the Dragon, and the King who inaugurates the New Heaven, New Earth, and New Jerusalem where God dwells with man forever.","key_themes":["The Unveiling of the Glorified Christ","To Him That Overcometh (Letters to the 7 Churches)","The Slain Lamb Worthy to Open the Scroll","The New Heaven, New Earth, & 'Behold, I Come Quickly'"],"lessons":[{"number":1,"title":"Read, hear, and keep the words of prophecy for the time is near","citation":"Revelation 1:3","scripture_text":"Blessed is he that readeth, and they that hear the words of this prophecy, and keep those things which are written therein: for the time is at hand.","lesson":"Studying and obeying God's prophetic Word brings a unique blessing and clarifies eternal priorities.","application":"Read Scripture with an ear to obey and apply its timeless truths today."},{"number":2,"title":"Behold Jesus as the Living One who holds the keys of death and hell","citation":"Revelation 1:17-18","scripture_text":"Fear not; I am the first and the last: I am he that liveth, and was dead; and, behold, I am alive for evermore, Amen; and have the keys of hell and of death.","lesson":"Jesus has conquered the grave and holds absolute sovereign authority over death, hell, and history.","application":"Fear nothing today, knowing your Living Savior holds the master keys of eternity."},{"number":3,"title":"Return to your first love and do the first works (Ephesus)","citation":"Revelation 2:4-5","scripture_text":"Nevertheless I have somewhat against thee, because thou hast left thy first love. Remember therefore from whence thou art fallen, and repent, and do the first works...","lesson":"Do not let theological orthodoxy or busy religious activity replace warm, passionate first love for Jesus.","application":"Rekindle your personal intimacy and simple devotion to Jesus today."},{"number":4,"title":"Be faithful unto death and receive the crown of life (Smyrna)","citation":"Revelation 2:10","scripture_text":"Fear none of those things which thou shalt suffer... be thou faithful unto death, and I will give thee a crown of life.","lesson":"Do not fear suffering or worldly threats; unwavering faithfulness to Christ is rewarded with eternal life.","application":"Commit to remaining faithful to Christ regardless of the personal cost."},{"number":5,"title":"Reject lukewarm complacency and buy gold refined in the fire (Laodicea)","citation":"Revelation 3:15-16,18","scripture_text":"I know thy works, that thou art neither cold nor hot: I would thou wert cold or hot. So then because thou art lukewarm... I will spue thee out of my mouth... I counsel thee to buy of me gold tried in the fire...","lesson":"Lukewarm, half-hearted compromise is nauseating to God; cultivate zealous spiritual passion and true kingdom wealth.","application":"Stir up wholehearted passion for Christ and abandon lukewarm mediocrity."},{"number":6,"title":"Open the door when Jesus knocks: experience intimate fellowship","citation":"Revelation 3:20","scripture_text":"Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.","lesson":"Jesus tenderly knocks on the door of your heart, inviting you into intimate, shared fellowship and communion.","application":"Open your heart in quiet prayer to dine and commune with Jesus right now."},{"number":7,"title":"Worship the Lamb who was slain and is worthy of all power and glory","citation":"Revelation 5:9,12","scripture_text":"Thou art worthy to take the book, and to open the seals thereof: for thou wast slain, and hast redeemed us to God by thy blood... Saying with a loud voice, Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.","lesson":"The focal point of heaven's worship is the Lamb who redeemed us by His blood; offer Him your supreme praise.","application":"Spend time offering heartfelt worship to the Lamb of God who died for you."},{"number":8,"title":"Overcome the accuser by the blood of the Lamb and the word of your testimony","citation":"Revelation 12:11","scripture_text":"And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death.","lesson":"Satan's accusations and attacks are defeated by Christ's shed blood, your bold public testimony, and sacrificial courage.","application":"Stand upon the blood of Jesus to silence feelings of accusation and share your testimony of grace."},{"number":9,"title":"Anticipate the day when God wipes away all tears and ends death and pain","citation":"Revelation 21:3-4","scripture_text":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","lesson":"Our present suffering is temporary; God will personally wipe away every tear and establish a world of pure joy and peace.","application":"Comfort your heart in grief knowing that eternal joy and restoration are coming."},{"number":10,"title":"Drink freely from the water of life and respond: 'Even so, come, Lord Jesus'","citation":"Revelation 22:17,20","scripture_text":"And let him that is athirst come. And whosoever will, let him take the water of life freely... He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.","lesson":"Salvation's living water is freely offered to all who thirst; live with eager anticipation of Christ's return.","application":"Drink deeply of Christ's grace and live with the prayer: 'Even so, come, Lord Jesus.'"}]}]};
let currentBookIndex = 0;

function init() {
  renderSidebar();
  renderBook(0);
}

function renderSidebar(filteredBooks = null) {
  const booksToRender = filteredBooks || studyData.books;
  const listEl = document.getElementById('sidebarList');
  listEl.innerHTML = '';

  let currentCategory = '';
  const ul = document.createElement('ul');
  ul.className = 'book-list';

  booksToRender.forEach((b) => {
    const origIndex = studyData.books.findIndex(item => item.book === b.book);
    if (!filteredBooks && b.category !== currentCategory) {
      currentCategory = b.category;
      const catHeader = document.createElement('div');
      catHeader.className = 'section-label';
      catHeader.textContent = `${b.testament === 'OT' ? 'Old Testament' : 'New Testament'} · ${b.category}`;
      ul.appendChild(catHeader);
    }

    const li = document.createElement('li');
    li.className = `book-item ${origIndex === currentBookIndex ? 'active' : ''}`;
    li.onclick = () => {
      currentBookIndex = origIndex;
      renderBook(origIndex);
      document.querySelectorAll('.book-item').forEach(el => el.classList.remove('active'));
      li.classList.add('active');
    };
    li.innerHTML = `<span>${b.book}</span><span class="book-num">${b.order}</span>`;
    ul.appendChild(li);
  });

  listEl.appendChild(ul);
}

function renderBook(index) {
  const b = studyData.books[index];
  if (!b) return;
  
  const container = document.getElementById('mainContainer');
  
  let html = `
    <div class="book-banner">
      <div class="book-meta-row">
        <span class="pill">${b.testament === 'OT' ? 'Old Testament' : 'New Testament'}</span>
        <span class="pill category">${b.category}</span>
        <span style="color:var(--muted); font-size:12px; margin-left:auto;">Book ${b.order} of 66</span>
      </div>
      <h1 class="book-title">${b.book}</h1>
      <p class="book-overview">${b.overview}</p>
      
      <div class="themes-title">Core Themes</div>
      <div class="theme-chips">
        ${b.key_themes.map(t => `<span class="theme-chip">${t}</span>`).join('')}
      </div>
    </div>

    <div class="lessons-heading">
      <div>10 Actionable Life Lessons</div>
      <span>${b.lessons.length} Scripture Principles</span>
    </div>

    <div class="lessons-grid">
      ${b.lessons.map(l => `
        <div class="lesson-card">
          <div class="lesson-head">
            <div class="lesson-title-wrap">
              <div class="lesson-badge">${l.number}</div>
              <h3 class="lesson-title">${l.title}</h3>
            </div>
            <span class="lesson-citation">${l.citation}</span>
          </div>
          
          <div class="scripture-quote">"${l.scripture_text}"</div>
          
          <div class="lesson-section">
            <div class="section-tag">Behavioral Principle / Rule</div>
            <p class="principle-text">${l.lesson}</p>
          </div>

          <div class="app-box">
            <div class="section-tag">Daily Action Prompt</div>
            <p class="app-text">${l.application}</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  container.innerHTML = html;
  container.parentElement.scrollTop = 0;
}

function handleSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    renderSidebar();
    renderBook(currentBookIndex);
    return;
  }

  const matchingBooks = studyData.books.filter(b => {
    if (b.book.toLowerCase().includes(query)) return true;
    if (b.overview.toLowerCase().includes(query)) return true;
    if (b.key_themes.some(t => t.toLowerCase().includes(query))) return true;
    if (b.lessons.some(l => 
      l.title.toLowerCase().includes(query) || 
      l.lesson.toLowerCase().includes(query) || 
      l.application.toLowerCase().includes(query) ||
      l.citation.toLowerCase().includes(query)
    )) return true;
    return false;
  });

  renderSidebar(matchingBooks);
  if (matchingBooks.length > 0) {
    const firstIdx = studyData.books.findIndex(b => b.book === matchingBooks[0].book);
    currentBookIndex = firstIdx;
    renderBook(firstIdx);
  } else {
    document.getElementById('mainContainer').innerHTML = `<div style="text-align:center; padding:60px; color:var(--muted);">No books or lessons match "<b>${query}</b>"</div>`;
  }
}

window.onload = init;
</script>

</body>
</html>
