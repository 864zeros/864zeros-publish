# train_config_paintings.toml — LoRA Training Configuration for 864z Jeff Painting Style
# Model Base: Stable Diffusion XL 1.0 (SDXL) / Flux Compatible

[model_arguments]
v2 = false
v_parameterization = false
pretrained_model_name_or_path = "stabilityai/stable-diffusion-xl-base-1.0"

[dataset_arguments]
train_data_dir = "media/visuals/training_pools/paintings"
resolution = "1024,1024"
enable_bucket = true
min_bucket_reso = 512
max_bucket_reso = 1536
bucket_reso_steps = 64
bucket_no_upscale = false

[training_arguments]
output_dir = "media/visuals/lora_weights"
output_name = "864z_jeff_painting_v1"
save_precision = "fp16"
save_model_as = "safetensors"
train_batch_size = 2
max_train_epochs = 10
save_every_n_epochs = 2
mixed_precision = "fp16"
seed = 42

[optimizer_arguments]
optimizer_type = "AdamW8bit"
learning_rate = 1e-4
unet_lr = 1e-4
text_encoder_lr = 5e-5
lr_scheduler = "cosine_with_restarts"
lr_warmup_steps = 100

[network_arguments]
network_module = "networks.lora"
network_dim = 32
network_alpha = 16
network_train_unet_only = false

[sample_prompt_arguments]
sample_every_n_epochs = 2
sample_prompts = [
    "jeff_painting style, portrait of an elder in meditation, dramatic chiaroscuro lighting, rich warm oil glazes, textured canvas, expressive brush strokes",
    "jeff_painting style, a radiant dawn breaking over rugged coastal cliffs, vibrant acrylic impasto, luminous reflection on ocean water",
    "jeff_painting style, a solitary figure walking through an autumn forest illuminated by golden sunlight, painterly palette, traditional fine art"
]
