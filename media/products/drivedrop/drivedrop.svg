<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="sage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2BFA0" />
      <stop offset="100%" stop-color="#7A9A77" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="2.5" />

  <!-- Google Drive Receiving Folder -->
  <path d="M 24 56 L 46 56 L 54 64 L 100 64 C 104 64 106 66 106 70 L 106 96 C 106 100 104 102 100 102 L 28 102 C 24 102 22 100 22 96 L 22 62 C 22 58 24 56 28 56 Z" fill="#18202C" stroke="#2D3A4F" stroke-width="2" />
  <!-- Folder Front Pocket / Drop Slot -->
  <path d="M 22 74 L 106 74 L 100 102 L 28 102 Z" fill="#141A24" stroke="url(#sage-grad)" stroke-width="1.8" />

  <!-- Incoming Document Dropping In -->
  <rect x="48" y="24" width="32" height="42" rx="4" fill="#1F2836" stroke="#4B5563" stroke-width="1.8" />
  <line x1="56" y1="34" x2="72" y2="34" stroke="#8BA888" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="42" x2="68" y2="42" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="50" x2="64" y2="50" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" />

  <!-- Bold Downward Drop Arrow in Sage -->
  <g transform="translate(64, 52)">
    <path d="M 0 -12 L 0 16" stroke="url(#sage-grad)" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="-8,10 0,22 8,10" fill="#8BA888" />
  </g>

  <!-- Security Keyhole / Lock Badge -->
  <circle cx="94" cy="40" r="10" fill="#11151F" stroke="#8BA888" stroke-width="1.5" />
  <circle cx="94" cy="38" r="2.5" fill="#8BA888" />
  <path d="M 94 40.5 L 94 44" stroke="#8BA888" stroke-width="1.8" stroke-linecap="round" />
</svg>
