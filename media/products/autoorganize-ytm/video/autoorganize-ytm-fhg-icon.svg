<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="AutoOrganize icon">
  <defs>
    <linearGradient id="fhg-bg-autoorganize-ytm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDFCF8"/>
      <stop offset="100%" stop-color="#F2E8D8"/>
    </linearGradient>
    <linearGradient id="fhg-bronze-autoorganize-ytm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C744C"/>
      <stop offset="100%" stop-color="#705032"/>
    </linearGradient>
  </defs>
  <!-- Warm Parchment Outer Frame -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fhg-bg-autoorganize-ytm)" stroke="#C8B296" stroke-width="6"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="#E6DAC8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Top Pillar Pill -->
  <rect x="76" y="34" width="104" height="28" rx="14" fill="#F6EFE4" stroke="#D8C7B0" stroke-width="2"/>
  <text x="128" y="53" text-anchor="middle" font-family="'Nunito','Inter',system-ui,sans-serif" font-size="13" font-weight="800" fill="#705032" letter-spacing="1.2">OIA · LOCAL</text>
  <!-- Center Bronze Medallion -->
  <rect x="56" y="76" width="144" height="112" rx="26" fill="url(#fhg-bronze-autoorganize-ytm)" stroke="#5A3E24" stroke-width="3"/>
  <text x="128" y="148" text-anchor="middle" font-family="'Nunito','Inter',system-ui,sans-serif" font-size="54" font-weight="900" fill="#FDFCF8" letter-spacing="1">AO</text>
  <!-- Bottom Check Seal -->
  <rect x="64" y="200" width="128" height="24" rx="12" fill="#ECFDF5" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="128" y="216" text-anchor="middle" font-family="'Nunito','Inter',system-ui,sans-serif" font-size="11" font-weight="800" fill="#166534">✓ ZERO CLOUD RENT</text>
