<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131F"/>
      <stop offset="100%" stop-color="#04090F"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gridGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Shield Contour -->
  <path d="M64 16 L100 28 V64 C100 86 64 108 64 108 C64 108 28 86 28 64 V28 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Left Spreadsheet Mini-Card -->
  <g transform="translate(24, 38)">
    <rect width="32" height="42" rx="4" fill="url(#gridGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect width="32" height="10" rx="4" fill="url(#emeraldGrad)"/>
    <!-- Grid lines -->
    <line x1="11" y1="10" x2="11" y2="42" stroke="#334155" stroke-width="1"/>
    <line x1="21" y1="10" x2="21" y2="42" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="20" x2="32" y2="20" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="31" x2="32" y2="31" stroke="#334155" stroke-width="1"/>
    <!-- Cells fill -->
    <rect x="2" y="12" width="7" height="6" rx="1" fill="#10B981" opacity="0.6"/>
    <rect x="13" y="23" width="6" height="6" rx="1" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- Right Master Spreadsheet Card (Elevated) -->
  <g transform="translate(72, 48)">
    <rect width="32" height="42" rx="4" fill="url(#gridGrad1)" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <rect width="32" height="10" rx="4" fill="url(#cyanGrad)"/>
    <!-- Grid lines -->
    <line x1="11" y1="10" x2="11" y2="42" stroke="#334155" stroke-width="1"/>
    <line x1="21" y1="10" x2="21" y2="42" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="20" x2="32" y2="20" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="31" x2="32" y2="31" stroke="#334155" stroke-width="1"/>
    <!-- Consolidated Cells -->
    <rect x="2" y="12" width="7" height="6" rx="1" fill="#10B981"/>
    <rect x="13" y="12" width="6" height="6" rx="1" fill="#38BDF8"/>
    <rect x="2" y="23" width="7" height="6" rx="1" fill="#34D399"/>
    <rect x="23" y="23" width="7" height="6" rx="1" fill="#0284C7"/>
  </g>

  <!-- Dynamic Sovereign Sync Loop Arrows (Connecting Left to Right) -->
  <!-- Top Arrow (Left to Right) -->
  <path d="M 48 32 C 60 22, 70 24, 76 34" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="78,38 71,32 79,28" fill="#34D399"/>

  <!-- Bottom Arrow (Right to Left / Loop) -->
  <path d="M 80 96 C 68 106, 58 104, 52 94" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="50,90 57,96 49,100" fill="#38BDF8"/>
</svg>
