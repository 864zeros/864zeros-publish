<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 864zeros Obsidian/Forms-Docs App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg_grad)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke="url(#border_grad)" stroke-width="1"/>

  <!-- Left Side: Google Forms Response Card -->
  <rect x="20" y="32" width="38" height="64" rx="4" fill="#1b152b" stroke="#7248b9" stroke-width="1.8"/>
  <rect x="25" y="38" width="18" height="3" rx="1.5" fill="#a78bfa"/>
  <!-- Checkbox items -->
  <rect x="25" y="48" width="4" height="4" rx="1" fill="#7248b9"/>
  <rect x="32" y="49" width="18" height="2" rx="1" fill="#475569"/>
  <rect x="25" y="58" width="4" height="4" rx="1" fill="#7248b9"/>
  <rect x="32" y="59" width="20" height="2" rx="1" fill="#475569"/>
  <rect x="25" y="68" width="4" height="4" rx="1" fill="#7248b9"/>
  <rect x="32" y="69" width="14" height="2" rx="1" fill="#475569"/>

  <!-- Center: Merge Pipeline Transformation Arrow -->
  <path d="M58 64H70" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M66 59L71 64L66 69" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Side: Generated Google Doc / PDF Document -->
  <rect x="70" y="24" width="42" height="68" rx="5" fill="#131c2e" stroke="#2563eb" stroke-width="2"/>
  <!-- Document Folded Corner -->
  <path d="M98 24V36H112L98 24Z" fill="#1e293b"/>
  <path d="M98 24L112 38" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Merged Content Lines -->
  <rect x="76" y="42" width="22" height="3" rx="1.5" fill="#60a5fa"/>
  <rect x="76" y="50" width="28" height="2" rx="1" fill="#94a3b8"/>
  <rect x="76" y="56" width="26" height="2" rx="1" fill="#94a3b8"/>
  <rect x="76" y="62" width="20" height="2" rx="1" fill="#94a3b8"/>

  <!-- PDF Stamp Badge Bottom Right of Document -->
  <rect x="74" y="72" width="20" height="12" rx="2.5" fill="#ea4335"/>
  <text x="84" y="81" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="7" font-weight="900" text-anchor="middle">PDF</text>

  <!-- Sovereign Shield Badge Bottom Right -->
  <circle cx="94" cy="98" r="11" fill="#06090e" stroke="#7248b9" stroke-width="1.5"/>
  <path d="M90 98L93 101L98 95" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e0a1a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7248b9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
</svg>
