<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 864zeros Obsidian/Forms-Purple App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg_grad)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke="url(#border_grad)" stroke-width="1"/>

  <!-- Stopwatch Top Button & Ring -->
  <rect x="60" y="20" width="8" height="7" rx="2" fill="#a78bfa"/>
  <path d="M54 27H74" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <rect x="83" y="28" width="6" height="5" rx="1.5" transform="rotate(35 83 28)" fill="#8b5cf6"/>

  <!-- Stopwatch Outer Bezel -->
  <circle cx="64" cy="70" r="38" fill="#131424" stroke="url(#timer_ring_grad)" stroke-width="3.5"/>

  <!-- Stopwatch Face Inner Shadow/Tints -->
  <circle cx="64" cy="70" r="33" fill="#0d0e1a"/>

  <!-- Hour / 5-minute ticks around the face -->
  <circle cx="64" cy="41" r="1.5" fill="#a78bfa"/>
  <circle cx="93" cy="70" r="1.5" fill="#a78bfa"/>
  <circle cx="64" cy="99" r="1.5" fill="#a78bfa"/>
  <circle cx="35" cy="70" r="1.5" fill="#a78bfa"/>

  <circle cx="85" cy="49" r="1" fill="#6d28d9"/>
  <circle cx="85" cy="91" r="1" fill="#6d28d9"/>
  <circle cx="43" cy="91" r="1" fill="#6d28d9"/>
  <circle cx="43" cy="49" r="1" fill="#6d28d9"/>

  <!-- Elapsed Countdown Arc (Active Sweep in Violet/Cyan) -->
  <path d="M64 37 A33 33 0 0 1 97 70" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>

  <!-- Google Forms Checklist Lines inside the Dial -->
  <rect x="49" y="58" width="16" height="2" rx="1" fill="#6d28d9"/>
  <rect x="49" y="64" width="22" height="2" rx="1" fill="#6d28d9"/>
  <rect x="49" y="70" width="14" height="2" rx="1" fill="#6d28d9"/>
  <circle cx="44" cy="59" r="1.5" fill="#38bdf8"/>
  <circle cx="44" cy="65" r="1.5" fill="#38bdf8"/>
  <circle cx="44" cy="71" r="1.5" fill="#38bdf8"/>

  <!-- Center Pivot Pin -->
  <circle cx="64" cy="70" r="3.5" fill="#c4b5fd"/>

  <!-- Stopwatch Hands (Active countdown state) -->
  <!-- Minute Hand pointing up -->
  <line x1="64" y1="70" x2="64" y2="48" stroke="#f5f3ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second / Indicator Hand pointing to ~2 o'clock -->
  <line x1="64" y1="70" x2="82" y2="55" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Little Center Dot -->
  <circle cx="64" cy="70" r="1.5" fill="#7c3aed"/>

  <!-- Verified Sovereign Shield Badge Bottom Right -->
  <circle cx="94" cy="98" r="11" fill="#0b0f17" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M90 98L93 101L98 95" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0816"/>
      <stop offset="1" stop-color="#191330"/>
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="timer_ring_grad" x1="26" y1="32" x2="102" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
</svg>
