<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 864zeros Obsidian/Sheets-Green App Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg_grad)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" stroke="url(#border_grad)" stroke-width="1"/>

  <!-- Top Active Sheet Representation -->
  <rect x="26" y="24" width="76" height="32" rx="5" fill="#0d1b14" stroke="#0f9d58" stroke-width="1.8"/>
  <path d="M26 34H102" stroke="#1b3d2b" stroke-width="1.5"/>
  <path d="M48 24V56" stroke="#1b3d2b" stroke-width="1.5"/>
  <path d="M76 24V56" stroke="#1b3d2b" stroke-width="1.5"/>

  <!-- Active Rows Content -->
  <!-- Header row indicator -->
  <rect x="30" y="28" width="14" height="2" rx="1" fill="#34d399"/>
  <rect x="52" y="28" width="18" height="2" rx="1" fill="#34d399"/>
  <rect x="80" y="28" width="16" height="2" rx="1" fill="#34d399"/>

  <!-- Data Row 1 (Active) -->
  <rect x="30" y="38" width="12" height="2" rx="1" fill="#475569"/>
  <rect x="52" y="38" width="20" height="2" rx="1" fill="#475569"/>
  <rect x="80" y="38" width="14" height="2" rx="1" fill="#475569"/>

  <!-- Data Row 2 (Highlighted Done Row Being Archived) -->
  <rect x="27" y="44" width="74" height="10" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="30" y="48" width="14" height="2" rx="1" fill="#6ee7b7"/>
  <rect x="52" y="48" width="18" height="2" rx="1" fill="#6ee7b7"/>
  <rect x="80" y="48" width="16" height="2" rx="1" fill="#10b981"/>

  <!-- Transfer Arrow (Archiving Motion) -->
  <path d="M64 58V72" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 67L64 73L70 67" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom Archive Vault / Box Representation -->
  <rect x="24" y="76" width="80" height="34" rx="6" fill="#112219" stroke="#10b981" stroke-width="2"/>
  <!-- Archive Box Lid / Handle -->
  <rect x="50" y="82" width="28" height="6" rx="3" fill="#042f2e" stroke="#34d399" stroke-width="1.2"/>
  <!-- Archived File Slots -->
  <line x1="32" y1="96" x2="96" y2="96" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="102" x2="84" y2="102" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sovereign Shield Badge Bottom Right -->
  <circle cx="94" cy="98" r="11" fill="#06090e" stroke="#10b981" stroke-width="1.5"/>
  <path d="M90 98L93 101L98 95" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06120b"/>
      <stop offset="1" stop-color="#0d2417"/>
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f9d58" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
