<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A2BFA0"/>
      <stop offset="100%" stop-color="#6E8A6B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="3"/>

  <!-- Document Sheet -->
  <path d="M 28 22 L 76 22 L 96 42 L 96 104 C 96 107 93 110 90 110 L 28 110 C 25 110 22 107 22 104 L 22 28 C 22 25 25 22 28 22 Z" fill="#0E121A" stroke="#2D3748" stroke-width="2"/>
  <!-- Folded Corner -->
  <path d="M 76 22 L 76 42 L 96 42" fill="#141820" stroke="#2D3748" stroke-width="2"/>

  <!-- Document Text Lines -->
  <line x1="32" y1="36" x2="66" y2="36" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="68" y2="48" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="60" x2="86" y2="60" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="72" x2="86" y2="72" stroke="#2D3748" stroke-width="2" stroke-linecap="round"/>

  <!-- Signature Baseline -->
  <line x1="32" y1="96" x2="86" y2="96" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Calligraphic Signature Stroke -->
  <path d="M 34 92 C 40 82, 44 80, 48 90 C 52 100, 56 84, 62 86 C 68 88, 72 82, 78 88 C 82 92, 86 85, 88 88" stroke="url(#sageGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Pen Nib / Stamp Accent -->
  <circle cx="88" cy="88" r="3.5" fill="#A2BFA0"/>
  <circle cx="34" cy="92" r="3" fill="#8BA888"/>
</svg>
