<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#ECE7DC"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#97B594"/>
      <stop offset="100%" stop-color="#728F6F"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B2A26" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B2A26" flood-opacity="0.12"/>
    </filter>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base (cream) -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="113" fill="none" stroke="#E2DDD2" stroke-width="2"/>

  <!-- Shield Base (Sage Green Crest) -->
  <g filter="url(#shadow)">
    <!-- Path scaled from 108dp viewBox (x4.0, centered in 512) -->
    <!-- Center (54,54) maps to (256, 256) -->
    <path
      d="M256,114
         L351,162
         L351,257
         C351,324 303,381 256,400
         C208,381 161,324 161,257
         L161,162
         Z"
      fill="url(#shieldGrad)"
    />
  </g>

  <!-- Inner Flame & Light Pillar (Warm White) -->
  <g filter="url(#flameGlow)">
    <!-- Candle body -->
    <rect x="237" y="210" width="38" height="95" rx="6" fill="#FDFCFA"/>
    <!-- Flame drop above candle -->
    <path
      d="M256,154
         C267,154 275,163 275,173
         C275,183 267,192 256,192
         C245,192 237,183 237,173
         C237,163 245,154 256,154
         Z"
      fill="#FDFCFA"
    />
  </g>
</svg>
