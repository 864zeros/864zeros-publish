<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="sage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2BFA0" />
      <stop offset="100%" stop-color="#7A9A77" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="2.5" />

  <!-- QR Finder Pattern: Top-Left -->
  <rect x="22" y="22" width="30" height="30" rx="6" fill="#141A24" stroke="url(#sage-grad)" stroke-width="2.5" />
  <rect x="28" y="28" width="18" height="18" rx="3" fill="#8BA888" />

  <!-- QR Finder Pattern: Bottom-Left -->
  <rect x="22" y="76" width="30" height="30" rx="6" fill="#141A24" stroke="url(#sage-grad)" stroke-width="2.5" />
  <rect x="28" y="82" width="18" height="18" rx="3" fill="#8BA888" />

  <!-- QR Finder Pattern: Top-Right -->
  <rect x="76" y="22" width="30" height="30" rx="6" fill="#141A24" stroke="url(#sage-grad)" stroke-width="2.5" />
  <rect x="82" y="28" width="18" height="18" rx="3" fill="#8BA888" />

  <!-- QR Center Matrix Data Points -->
  <rect x="36" y="58" width="6" height="6" rx="1.5" fill="#8BA888" />
  <rect x="44" y="58" width="6" height="6" rx="1.5" fill="#E5E7EB" />
  <rect x="58" y="24" width="6" height="6" rx="1.5" fill="#E5E7EB" />
  <rect x="58" y="34" width="6" height="6" rx="1.5" fill="#8BA888" />
  <rect x="58" y="44" width="6" height="6" rx="1.5" fill="#E5E7EB" />

  <!-- Barcode Bars (Right & Center-Bottom) -->
  <g transform="translate(62, 64)">
    <rect x="0" y="12" width="4" height="30" rx="1" fill="#E5E7EB" />
    <rect x="7" y="12" width="2" height="30" rx="1" fill="#8BA888" />
    <rect x="12" y="12" width="6" height="30" rx="1" fill="#E5E7EB" />
    <rect x="21" y="12" width="3" height="30" rx="1" fill="#8BA888" />
    <rect x="27" y="12" width="5" height="30" rx="1" fill="#E5E7EB" />
    <rect x="35" y="12" width="2" height="30" rx="1" fill="#8BA888" />
    <rect x="40" y="12" width="4" height="30" rx="1" fill="#E5E7EB" />
  </g>

  <!-- Permanent Quality Sparkle -->
  <circle cx="68" cy="54" r="2.5" fill="#A2BFA0" />
</svg>
