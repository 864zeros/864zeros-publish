<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A2BFA0"/>
      <stop offset="100%" stop-color="#6E8A6B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="3"/>

  <!-- Spreadsheet Grid Backdrop -->
  <rect x="22" y="24" width="84" height="60" rx="8" fill="#0E121A" stroke="#2D3748" stroke-width="2"/>
  <line x1="22" y1="42" x2="106" y2="42" stroke="#2D3748" stroke-width="2"/>
  <line x1="22" y1="60" x2="106" y2="60" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="50" y1="24" x2="50" y2="84" stroke="#2D3748" stroke-width="2"/>
  <line x1="78" y1="24" x2="78" y2="84" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Highlighted Trigger Cell -->
  <rect x="52" y="44" width="24" height="14" rx="3" fill="#8BA888" fill-opacity="0.25" stroke="#8BA888" stroke-width="1.5"/>

  <!-- Webhook Arrow / Signal Fork -->
  <path d="M 64 58 L 64 92" stroke="url(#sageGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 64 92 C 64 98, 42 100, 36 106" stroke="url(#sageGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 64 92 C 64 98, 86 100, 92 106" stroke="url(#sageGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Webhook Target Nodes -->
  <circle cx="36" cy="106" r="4.5" fill="#8BA888" filter="url(#glow)"/>
  <circle cx="92" cy="106" r="4.5" fill="#8BA888" filter="url(#glow)"/>
  <circle cx="64" cy="92" r="5" fill="#A2BFA0" filter="url(#glow)"/>
</svg>
