<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Outgoing Broadcast Rings -->
  <path d="M 88 38 A 20 20 0 0 1 96 56" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 94 32 A 28 28 0 0 1 106 56" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- Notification Bell Body -->
  <path d="M 64 26 C 54 26 46 34 46 44 L 46 64 L 38 74 L 38 78 L 90 78 L 90 74 L 82 64 L 82 44 C 82 34 74 26 64 26 Z" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="2" filter="url(#glow)" />

  <!-- Bell Clapper -->
  <path d="M 58 78 C 58 82 60 86 64 86 C 68 86 70 82 70 78 Z" fill="#93C5FD" />

  <!-- Envelope Icon Overlay -->
  <rect x="42" y="86" width="44" height="26" rx="5" fill="#0B1120" stroke="url(#cyanGrad)" stroke-width="2.5" />
  <path d="M 44 88 L 64 100 L 84 88" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
